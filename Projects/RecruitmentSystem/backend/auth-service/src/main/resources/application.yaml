spring:

  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/recruitment_db
    username: recruitment_app
    password: RecruitmentDev_Pg_2026!
    driver-class-name: org.postgresql.Driver

  jpa:
