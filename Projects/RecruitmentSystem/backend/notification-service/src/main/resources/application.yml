spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:../../.env[.properties]
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL}
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: notification_service
        format_sql: true
        jdbc:
          time_zone: ${JPA_TIME_ZONE}
  flyway:
    enabled: true
    baseline-on-migrate: true
    create-schemas: true
    schemas: notification_service
    default-schema: notification_service
    table: notification_service_flyway_schema_history
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST}

server:
  port: ${NOTIFICATION_SERVICE_PORT}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION}

notification:
  amqp:
    consumer-enabled: ${NOTIFICATION_AMQP_CONSUMER_ENABLED}
    exchange: ${NOTIFICATION_AMQP_EXCHANGE}
    queue: ${NOTIFICATION_AMQP_QUEUE}
    dead-letter-exchange: ${NOTIFICATION_AMQP_DLX}
    dead-letter-queue: ${NOTIFICATION_AMQP_DLQ}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
