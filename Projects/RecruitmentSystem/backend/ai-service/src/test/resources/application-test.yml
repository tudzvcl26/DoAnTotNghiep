spring:
  datasource:
    url: jdbc:h2:mem:ai_service_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        default_schema: public
  flyway:
    enabled: false
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false

jwt:
  secret: 4F8A9B72D35E1C847A91F6D28C5B9E73F84A9D21E6C4B7A15D8F2C93E7A4B6F18
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000

ai:
  resume:
    max-file-size: 10MB
    max-extracted-characters: 200000
  storage:
    endpoint: http://localhost:9000
    access-key: test
    secret-key: test-secret
    bucket: recruitment-ai-test
    auto-create-bucket: false
    initialize-on-startup: false
  messaging:
    initialize-topology: false
    inbound-exchange: recruitment.events.test
    outbound-exchange: ai.events.test
    queue: ai-service.events.test
    dead-letter-exchange: ai.dlx.test
    dead-letter-queue: ai-service.events.test.dlq
  providers:
    openai:
      enabled: false
      api-key:
      api-key-required: true
      base-url: https://api.openai.com/v1
      structured-model:
      embedding-model:
      connect-timeout: 1s
      read-timeout: 1s

management:
  health:
    redis:
      enabled: false
    rabbit:
      enabled: false
    ai-minio:
      enabled: false
