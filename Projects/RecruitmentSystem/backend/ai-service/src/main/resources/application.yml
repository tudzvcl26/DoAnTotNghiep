spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:../../.env[.properties]
  application:
    name: ai-service
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ai_service
        format_sql: true
        jdbc:
          time_zone: ${JPA_TIME_ZONE}
  flyway:
    enabled: true
    baseline-on-migrate: true
    create-schemas: true
    schemas: ai_service
    default-schema: ai_service
    table: ai_service_flyway_schema_history
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST}
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT}
      timeout: ${REDIS_TIMEOUT}
      repositories:
        enabled: false
  servlet:
    multipart:
      max-file-size: ${AI_RESUME_MAX_FILE_SIZE}
      max-request-size: ${AI_RESUME_MAX_REQUEST_SIZE}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    allow-credentials: ${APP_CORS_ALLOW_CREDENTIALS:false}
    max-age-seconds: ${APP_CORS_MAX_AGE_SECONDS:3600}

server:
  port: ${AI_SERVICE_PORT}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION}

ai:
  provider:
    type: ${AI_PROVIDER_TYPE}
  clients:
    recruitment-service-url: ${RECRUITMENT_SERVICE_URL}
    company-service-url: ${COMPANY_SERVICE_URL}
    connect-timeout: ${AI_CLIENT_CONNECT_TIMEOUT}
    read-timeout: ${AI_CLIENT_READ_TIMEOUT}
  matching:
    rule-version: ${AI_MATCHING_RULE_VERSION}
    weights-version: ${AI_MATCHING_WEIGHTS_VERSION}
    weights:
      technical-skills: ${AI_MATCHING_WEIGHT_TECHNICAL_SKILLS}
      experience: ${AI_MATCHING_WEIGHT_EXPERIENCE}
      education: ${AI_MATCHING_WEIGHT_EDUCATION}
      projects: ${AI_MATCHING_WEIGHT_PROJECTS}
      certificates: ${AI_MATCHING_WEIGHT_CERTIFICATES}
      languages: ${AI_MATCHING_WEIGHT_LANGUAGES}
      soft-skills: ${AI_MATCHING_WEIGHT_SOFT_SKILLS}
      keywords: ${AI_MATCHING_WEIGHT_KEYWORDS}
    technical-skill-catalog:
      - Java
      - Spring Boot
      - Spring Security
      - Hibernate
      - JPA
      - PostgreSQL
      - MySQL
      - MongoDB
      - Redis
      - RabbitMQ
      - Kafka
      - Docker
      - Kubernetes
      - AWS
      - Azure
      - Git
      - Maven
      - Gradle
      - Microservices
      - REST
      - GraphQL
      - JavaScript
      - TypeScript
      - React
      - Angular
      - Vue
      - Node.js
      - Python
      - C#
      - .NET
      - Go
    soft-skill-catalog:
      - Communication
      - Teamwork
      - Leadership
      - Problem solving
      - Time management
      - Adaptability
      - Critical thinking
    language-catalog:
      - English
      - Vietnamese
      - French
      - German
      - Japanese
      - Korean
      - Chinese
  resume:
    max-file-size: ${AI_RESUME_MAX_FILE_SIZE}
    max-extracted-characters: ${AI_RESUME_MAX_EXTRACTED_CHARACTERS}
  storage:
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${AI_MINIO_BUCKET}
    auto-create-bucket: ${AI_MINIO_AUTO_CREATE_BUCKET}
    initialize-on-startup: ${AI_MINIO_INITIALIZE_ON_STARTUP}
  messaging:
    initialize-topology: ${AI_AMQP_INITIALIZE_TOPOLOGY}
    inbound-exchange: ${AI_AMQP_INBOUND_EXCHANGE}
    outbound-exchange: ${AI_AMQP_OUTBOUND_EXCHANGE}
    queue: ${AI_AMQP_QUEUE}
    dead-letter-exchange: ${AI_AMQP_DLX}
    dead-letter-queue: ${AI_AMQP_DLQ}
  providers:
    ollama:
      enabled: ${OLLAMA_ENABLED}
      base-url: ${OLLAMA_BASE_URL}
      model: ${OLLAMA_MODEL}
      temperature: ${OLLAMA_TEMPERATURE}
      top-p: ${OLLAMA_TOP_P}
      timeout: ${OLLAMA_TIMEOUT}
    openai:
      enabled: ${OPENAI_ENABLED}
      api-key: ${OPENAI_API_KEY}
      api-key-required: ${OPENAI_API_KEY_REQUIRED}
      base-url: ${OPENAI_BASE_URL}
      structured-model: ${OPENAI_STRUCTURED_MODEL}
      embedding-model: ${OPENAI_EMBEDDING_MODEL}
      connect-timeout: ${OPENAI_CONNECT_TIMEOUT}
      read-timeout: ${OPENAI_READ_TIMEOUT}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: AI Service
    description: RecruitmentSystem resume analysis, deterministic recommendation, explanation, interview preparation, and structured assistant service
    phase: complete

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
  level:
    root: INFO
    com.recruitment.ai: INFO
