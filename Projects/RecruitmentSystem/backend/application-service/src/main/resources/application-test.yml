spring:

  application:
    name: application-service-test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS application_service
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: application_service
        format_sql: true
        jdbc:
          time_zone: UTC

  jackson:
    serialization:
      write-dates-as-timestamps: false

  flyway:
    enabled: false

server:
  port: 0

services:
  user-service:
    url: http://localhost:8082
  company-service:
    url: http://localhost:8083
  recruitment-service:
    url: http://localhost:8084

jwt:
  secret: 4F8A9B72D35E1C847A91F6D28C5B9E73F84A9D21E6C4B7A15D8F2C93E7A4B6F18
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000
