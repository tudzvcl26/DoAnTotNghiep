spring:

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:../../.env[.properties]

  application:
    name: application-service

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        default_schema: application_service
        format_sql: true
        jdbc:
          time_zone: ${JPA_TIME_ZONE}

  flyway:
    enabled: true
    baseline-on-migrate: true
    create-schemas: true
    schemas: application_service
    default-schema: application_service
    table: application_service_flyway_schema_history
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    allow-credentials: ${APP_CORS_ALLOW_CREDENTIALS:false}
    max-age-seconds: ${APP_CORS_MAX_AGE_SECONDS:3600}

server:
  port: ${APPLICATION_SERVICE_PORT}

services:
  user-service:
    url: ${USER_SERVICE_URL}
    connect-timeout-ms: ${APPLICATION_USER_CLIENT_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${APPLICATION_USER_CLIENT_READ_TIMEOUT_MS:5000}
  company-service:
    url: ${COMPANY_SERVICE_URL}
    connect-timeout-ms: ${APPLICATION_COMPANY_CLIENT_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${APPLICATION_COMPANY_CLIENT_READ_TIMEOUT_MS:5000}
  recruitment-service:
    url: ${RECRUITMENT_SERVICE_URL}
    connect-timeout-ms: ${APPLICATION_RECRUITMENT_CLIENT_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${APPLICATION_RECRUITMENT_CLIENT_READ_TIMEOUT_MS:5000}

storage:
  resume:
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${USER_MINIO_BUCKET}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION}

application:
  outbox:
    publisher:
      enabled: ${APPLICATION_OUTBOX_PUBLISHER_ENABLED:true}
      exchange: ${NOTIFICATION_AMQP_EXCHANGE:recruitment.events}
      fixed-delay-ms: ${APPLICATION_OUTBOX_FIXED_DELAY_MS:1000}
      batch-size: ${APPLICATION_OUTBOX_BATCH_SIZE:50}
      max-attempts: ${APPLICATION_OUTBOX_MAX_ATTEMPTS:10}

springdoc:

  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs

  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

logging:

  level:
    root: INFO
    org.springframework: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG_LEVEL:WARN}
    org.hibernate.orm.jdbc.bind: ${HIBERNATE_BIND_LOG_LEVEL:OFF}

management:

  endpoints:

    web:

      exposure:
        include: health

  endpoint:
    health:
      show-details: never
